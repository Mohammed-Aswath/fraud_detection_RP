# Dataset locations, relative to the repository root.
data:
  raw_path: data/raw
  train_transaction_path: data/raw/train_transaction.csv
  train_identity_path: data/raw/train_identity.csv
  processed_path: data/processed
  splits_path: data/splits

# Chronological train, validation, and test allocations.
temporal_split:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

# Relative costs used when selecting a fraud decision policy.
cost_matrix:
  fp_cost: 5.0
  fn_cost_multiplier: 1.0

# Baseline LightGBM settings. scale_pos_weight is derived from the train split.
model:
  lightgbm:
    objective: binary
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 31
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    random_state: 42
    n_jobs: -1
  model_path: models/model.joblib

# Placeholder; tune against validation data later.
decision_threshold: 0.50

# MLflow defaults. Set use_dagshub to true and provide the endpoint when ready.
mlflow:
  experiment_name: fraud-risk-manager
  use_dagshub: false
  local_tracking_uri: mlruns
  dagshub_tracking_uri: ""
  registry_model_name: fraud-risk-manager-model

# Phase 2 feature-engineering settings.
feature_engineering:
  high_missingness_threshold: 0.90
  target_column: isFraud
  missing_category: __MISSING__
  target_encoding:
    columns:
      - card4
      - card6
      - P_emaildomain
      - R_emaildomain
      - DeviceType
      - DeviceInfo
    smoothing: 20.0
  velocity:
    card_column: card1
    email_column: P_emaildomain
    windows_seconds: [3600, 86400]
  encoder_artifact_path: artifacts/encoders.joblib
