stages:
  feature_engineering:
    cmd: uv run python -m src.features.engineer
    deps:
      - data/splits/train.parquet
      - data/splits/val.parquet
      - data/splits/test.parquet
      - src/features/engineer.py
      - config/config.yaml
    outs:
      - data/processed/train_features.parquet
      - data/processed/val_features.parquet
      - data/processed/test_features.parquet
      - artifacts/encoders.joblib
  train:
    cmd: uv run python -m src.models.train
    deps:
      - data/processed/train_features.parquet
      - data/processed/val_features.parquet
      - data/processed/test_features.parquet
      - src/models/train.py
      - src/models/cost_matrix.py
      - config/config.yaml
    outs:
      - models/model.joblib
  explain:
    cmd: uv run python -m src.explain.shap_explainer
    deps:
      - models/model.joblib
      - data/processed/test_features.parquet
      - src/explain/shap_explainer.py
    outs:
      - artifacts/shap/
